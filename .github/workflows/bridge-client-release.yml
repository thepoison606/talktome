name: Bridge Client Builds

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - ".github/workflows/bridge-client-release.yml"
      - "bridge-client/**"
      - "scripts/resolve-build-version.js"
      - "scripts/upload-release-asset.sh"

concurrency:
  group: bridge-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    name: Resolve build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build-version.outputs.version }}
      app_version: ${{ steps.build-version.outputs.app_version }}
      safe_version: ${{ steps.build-version.outputs.safe_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version from Git tags
        id: build-version
        shell: bash
        run: node scripts/resolve-build-version.js --github-output "$GITHUB_OUTPUT"

  build:
    name: Build Bridge ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      SAFE_VERSION: ${{ needs.version.outputs.safe_version }}
      TALKTOME_BUILD_VERSION: ${{ needs.version.outputs.app_version }}
      TALKTOME_BUILD_SAFE_VERSION: ${{ needs.version.outputs.safe_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            ffmpeg_source: macos-lgpl
            ffmpeg_sidecar: ffmpeg-aarch64-apple-darwin
            artifact_name: talktome_bridge_macos_arm64
            artifact_glob: bridge-client/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-latest
            ffmpeg_source: windows-lgpl
            ffmpeg_sidecar: ffmpeg-x86_64-pc-windows-msvc.exe
            artifact_name: talktome_bridge_windows_x64
            artifact_glob: bridge-client/src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bridge-client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge-client/src-tauri

      - name: Install dependencies
        working-directory: bridge-client
        run: npm ci

      - name: Apply resolved version to build metadata
        shell: bash
        run: >-
          node scripts/resolve-build-version.js
          --tauri-config bridge-client/tauri.release-version.json

      - name: Restore LGPL FFmpeg sidecar
        id: ffmpeg-sidecar
        uses: actions/cache@v6
        with:
          path: bridge-client/.ffmpeg-sidecars/${{ matrix.ffmpeg_sidecar }}
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('bridge-client/scripts/build-ffmpeg-lgpl-*.sh') }}

      - name: Setup MSYS2
        if: matrix.ffmpeg_source == 'windows-lgpl' && steps.ffmpeg-sidecar.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            diffutils
            tar
            gzip
            xz
            curl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm

      - name: Build LGPL FFmpeg sidecar from source
        if: matrix.ffmpeg_source == 'macos-lgpl' && steps.ffmpeg-sidecar.outputs.cache-hit != 'true'
        working-directory: bridge-client
        run: scripts/build-ffmpeg-lgpl-macos.sh --release

      - name: Build Bridge with source-built FFmpeg
        if: matrix.ffmpeg_source == 'macos-lgpl'
        working-directory: bridge-client
        env:
          FFMPEG_SIDECAR_SOURCE: ${{ github.workspace }}/bridge-client/.ffmpeg-sidecars/ffmpeg-aarch64-apple-darwin
        run: |
          npm run prepare:ffmpeg -- --release --force
          npm run prepare:omt -- --release --force
          npm exec tauri build -- --bundles dmg --config tauri.release-version.json
          scripts/hide-macos-dmg-app-extension.sh

      - name: Build LGPL FFmpeg sidecar from source
        if: matrix.ffmpeg_source == 'windows-lgpl' && steps.ffmpeg-sidecar.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: bridge-client
        run: scripts/build-ffmpeg-lgpl-mingw.sh --release

      - name: Build Bridge with source-built FFmpeg
        if: matrix.ffmpeg_source == 'windows-lgpl'
        working-directory: bridge-client
        env:
          FFMPEG_SIDECAR_SOURCE: ${{ github.workspace }}/bridge-client/.ffmpeg-sidecars/ffmpeg-x86_64-pc-windows-msvc.exe
        run: |
          npm run prepare:ffmpeg -- --release --force
          npm run prepare:omt -- --release --force
          npm exec tauri build -- --bundles nsis --config tauri.release-version.json

      - name: Verify macOS Bridge version
        if: matrix.ffmpeg_source == 'macos-lgpl'
        shell: bash
        run: |
          shopt -s nullglob
          DMG_FILES=(bridge-client/src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ ${#DMG_FILES[@]} -ne 1 ]]; then
            printf 'Expected exactly one macOS Bridge DMG, found %s\n' "${#DMG_FILES[@]}" >&2
            exit 1
          fi

          MOUNT_POINT="$(mktemp -d)"
          MOUNTED=false
          cleanup() {
            if [[ "$MOUNTED" == true ]]; then
              hdiutil detach "$MOUNT_POINT" >/dev/null || true
            fi
            rm -rf "$MOUNT_POINT"
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_POINT" "${DMG_FILES[0]}" >/dev/null
          MOUNTED=true
          APP_PLIST="$MOUNT_POINT/Talktome Bridge.app/Contents/Info.plist"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")"
          ACTUAL_BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          if [[ "$ACTUAL_VERSION" != "$APP_VERSION" || "$ACTUAL_BUILD_VERSION" != "$APP_VERSION" ]]; then
            printf 'Expected Bridge version %s, found short version %s and build version %s\n' \
              "$APP_VERSION" "$ACTUAL_VERSION" "$ACTUAL_BUILD_VERSION" >&2
            exit 1
          fi

      - name: Verify Windows Bridge version
        if: matrix.ffmpeg_source == 'windows-lgpl'
        shell: pwsh
        run: |
          $binary = Get-Item "bridge-client/src-tauri/target/release/talktome-bridge-client.exe"
          $actualVersion = $binary.VersionInfo.ProductVersion
          if (-not $actualVersion.StartsWith($env:APP_VERSION)) {
            throw "Expected Bridge version $env:APP_VERSION, found $actualVersion"
          }

      - name: Prepare Bridge artifact
        shell: bash
        run: |
          mkdir -p bridge-client/release-artifacts
          shopt -s nullglob
          matches=( ${{ matrix.artifact_glob }} )
          if [[ ${#matches[@]} -ne 1 ]]; then
            printf 'Expected exactly one artifact for %s, found %s\n' "${{ matrix.artifact_glob }}" "${#matches[@]}" >&2
            exit 1
          fi

          source_file="${matches[0]}"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            target_name="${{ matrix.artifact_name }}_${SAFE_VERSION}_setup.exe"
          else
            target_name="${{ matrix.artifact_name }}_${SAFE_VERSION}.dmg"
          fi

          target_path="bridge-client/release-artifacts/$target_name"
          cp "$source_file" "$target_path"
          echo "BRIDGE_INSTALLER_NAME=$target_name" >> "$GITHUB_ENV"
          echo "BRIDGE_INSTALLER_PATH=$target_path" >> "$GITHUB_ENV"

      - name: Upload Bridge artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BRIDGE_INSTALLER_NAME }}
          if-no-files-found: error
          path: ${{ env.BRIDGE_INSTALLER_PATH }}

      - name: Upload Bridge artifact to draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          bash scripts/upload-release-asset.sh
          "$GITHUB_REF_NAME"
          "$BRIDGE_INSTALLER_PATH"
          "$GITHUB_REF_NAME - macOS + Windows"

name: Release Builds

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "*.js"
      - "gateway/**"
      - "public/**"
      - "scripts/copy-runtime-deps.js"
      - "scripts/docker-smoke-test.sh"
      - "scripts/native-startup-smoke-test.mjs"
      - "scripts/postbuild-pkg.js"
      - "scripts/create-macos-dmg.sh"
      - "scripts/resolve-build-version.js"
      - "scripts/upload-release-asset.sh"
      - "server-app/**"

concurrency:
  group: release-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Resolve build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      app_version: ${{ steps.release-version.outputs.app_version }}
      safe_version: ${{ steps.release-version.outputs.safe_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version from Git tags
        id: release-version
        shell: bash
        run: node scripts/resolve-build-version.js --github-output "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      SAFE_VERSION: ${{ needs.version.outputs.safe_version }}
      TALKTOME_BUILD_VERSION: ${{ needs.version.outputs.app_version }}
      TALKTOME_BUILD_SAFE_VERSION: ${{ needs.version.outputs.safe_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            build_script: build:win64
            server_build_script: build:release:windows
            executable_name: talktome_win64.exe
            artifact_prefix: talktome_server_windows_x64
            artifact_glob: server-app/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS arm64
            os: macos-14
            build_script: build:mac_arm64
            server_build_script: build:release:macos
            executable_name: talktome_arm64
            artifact_prefix: talktome_server_macos_arm64
            artifact_glob: server-app/src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply resolved version to build metadata
        shell: bash
        run: >-
          node scripts/resolve-build-version.js
          --tauri-config server-app/tauri.release-version.json

      - name: Build package
        run: npm run ${{ matrix.build_script }}

      - name: Start and verify packaged server
        shell: bash
        run: >-
          node scripts/native-startup-smoke-test.mjs
          --mode server
          --executable "${{ matrix.executable_name }}"
          --expected-version "$APP_VERSION"
          --timeout-seconds 120

      - name: Setup Node for server app
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-app/src-tauri

      - name: Install server app dependencies
        working-directory: server-app
        run: npm ci

      - name: Build server tray app
        working-directory: server-app
        env:
          TALKTOME_SERVER_SIDECAR_SOURCE: ${{ github.workspace }}/${{ matrix.executable_name }}
        run: npm run ${{ matrix.server_build_script }}

      - name: Locate macOS tray app
        if: matrix.os == 'macos-14'
        shell: bash
        run: >-
          echo "TRAY_EXECUTABLE=${GITHUB_WORKSPACE}/server-app/src-tauri/target/release/bundle/macos/Talktome Server.app/Contents/MacOS/talktome-server-app"
          >> "$GITHUB_ENV"

      - name: Install Windows tray app
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "server-app/src-tauri/target/release/bundle/nsis/*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "Silent NSIS installation failed with exit code $($install.ExitCode)."
          }

          $installRoot = Join-Path $env:LOCALAPPDATA "Talktome Server"
          $executables = @(
            Get-ChildItem $installRoot -Recurse -File -Filter "*.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @("Talktome Server.exe", "talktome-server-app.exe") }
          )
          if ($executables.Count -ne 1) {
            $found = if ($executables.Count) {
              ($executables.FullName -join ", ")
            } else {
              "none"
            }
            throw "Expected exactly one installed tray executable below $installRoot, found: $found"
          }

          "TRAY_EXECUTABLE=$($executables[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Start and verify bundled tray app
        shell: bash
        run: >-
          node scripts/native-startup-smoke-test.mjs
          --mode tray
          --executable "$TRAY_EXECUTABLE"
          --expected-version "$APP_VERSION"
          --timeout-seconds 120

      - name: Prepare server app artifact
        shell: bash
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob
          matches=( ${{ matrix.artifact_glob }} )
          if [[ ${#matches[@]} -ne 1 ]]; then
            printf 'Expected exactly one artifact for %s, found %s\n' "${{ matrix.artifact_glob }}" "${#matches[@]}" >&2
            exit 1
          fi

          source_file="${matches[0]}"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            target_name="${{ matrix.artifact_prefix }}_${SAFE_VERSION}_setup.exe"
          else
            target_name="${{ matrix.artifact_prefix }}_${SAFE_VERSION}.dmg"
          fi

          target_path="release-artifacts/$target_name"
          cp "$source_file" "$target_path"
          echo "INSTALLER_NAME=$target_name" >> "$GITHUB_ENV"
          echo "INSTALLER_PATH=$target_path" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.INSTALLER_NAME }}
          path: ${{ env.INSTALLER_PATH }}

      - name: Upload installer to draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          bash scripts/upload-release-asset.sh
          "$GITHUB_REF_NAME"
          "$INSTALLER_PATH"
          "$GITHUB_REF_NAME - macOS + Windows"

  docker-smoke:
    name: Verify Docker image startup
    needs: version
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        shell: bash
        run: >-
          docker build
          --build-arg "TALKTOME_VERSION=$APP_VERSION"
          --tag talktome:smoke-test
          .

      - name: Start and verify Docker image
        shell: bash
        run: scripts/docker-smoke-test.sh talktome:smoke-test "$APP_VERSION"

  docker:
    name: Build Docker image (${{ matrix.arch }})
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [version, docker-smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: linux-amd64
          - platform: linux/arm64
            arch: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Enable QEMU for cross-platform container builds
        shell: bash
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Create buildx builder
        shell: bash
        run: |
          docker buildx create --name talktome-builder --use
          docker buildx inspect --bootstrap

      - name: Build Docker image
        shell: bash
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg "TALKTOME_VERSION=${{ needs.version.outputs.app_version }}" \
            --tag "talktome:${IMAGE_TAG}-${{ matrix.arch }}" \
            --cache-from "type=gha,scope=talktome-${{ matrix.arch }}" \
            --cache-to "type=gha,mode=max,scope=talktome-${{ matrix.arch }}" \
            .

  docker-publish:
    name: Publish Docker image
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, docker-smoke]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/talktome
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/talktome
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TALKTOME_VERSION=${{ needs.version.outputs.app_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=talktome-multiarch
          cache-to: type=gha,mode=max,scope=talktome-multiarch

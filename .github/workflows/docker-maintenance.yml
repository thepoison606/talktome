name: Refresh Docker Image

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

concurrency:
  group: docker-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  refresh:
    name: Rebuild and publish latest release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout latest release tag
        id: release
        shell: bash
        run: |
          release_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [[ -z "$release_tag" ]]; then
            echo "No v* release tag found." >&2
            exit 1
          fi
          git checkout --detach "$release_tag"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Resolve application version
        id: version
        shell: bash
        run: node scripts/resolve-build-version.js --github-output "$GITHUB_OUTPUT"

      - name: Build smoke-test image
        run: >-
          docker build
          --pull
          --build-arg "TALKTOME_VERSION=${{ steps.version.outputs.app_version }}"
          --tag talktome:maintenance-smoke
          .

      - name: Verify image startup
        run: >-
          scripts/docker-smoke-test.sh
          talktome:maintenance-smoke
          "${{ steps.version.outputs.app_version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/talktome
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/talktome
          tags: |
            type=raw,value=latest

      - name: Rebuild and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TALKTOME_VERSION=${{ steps.version.outputs.app_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=talktome-maintenance
          cache-to: type=gha,mode=max,scope=talktome-maintenance

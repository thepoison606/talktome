name: Pull Request Checks

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-core:
    name: Server core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Reject new production dependency advisories
        run: node scripts/check-npm-audit-baseline.mjs .github/npm-audit-baseline.json

  bridge-client:
    name: Bridge client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: bridge-client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge-client/src-tauri

      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev
          libwebkit2gtk-4.1-dev
          libappindicator3-dev
          librsvg2-dev
          patchelf

      - name: Install JavaScript dependencies
        working-directory: bridge-client
        run: npm ci

      - name: Audit production dependencies
        working-directory: bridge-client
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      - name: Build UI
        working-directory: bridge-client
        run: npm run build:ui

      - name: Prepare CI sidecar placeholder
        run: |
          sidecar="bridge-client/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu"
          touch "$sidecar"
          chmod +x "$sidecar"

      - name: Check Rust
        run: cargo check --locked --manifest-path bridge-client/src-tauri/Cargo.toml

      - name: Test Rust
        run: cargo test --locked --manifest-path bridge-client/src-tauri/Cargo.toml --lib

  server-app:
    name: Server app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-app/src-tauri

      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev
          libappindicator3-dev
          librsvg2-dev
          patchelf

      - name: Install JavaScript dependencies
        working-directory: server-app
        run: npm ci

      - name: Audit production dependencies
        working-directory: server-app
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      - name: Build UI
        working-directory: server-app
        run: npm run build:ui

      - name: Prepare CI sidecar placeholders
        run: |
          sidecar="server-app/src-tauri/binaries/talktome-server-x86_64-unknown-linux-gnu"
          touch "$sidecar"
          chmod +x "$sidecar"
          touch server-app/src-tauri/binaries/better_sqlite3.node
          touch server-app/src-tauri/binaries/mediasoup-worker

      - name: Check Rust
        run: cargo check --locked --manifest-path server-app/src-tauri/Cargo.toml

      - name: Test Rust
        run: cargo test --locked --manifest-path server-app/src-tauri/Cargo.toml --lib

  headless-client:
    name: Headless client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: headless-client

      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          cmake
          pkg-config
          libasound2-dev
          libudev-dev

      - name: Check formatting
        run: cargo fmt --manifest-path headless-client/Cargo.toml --check

      - name: Lint
        run: cargo clippy --locked --manifest-path headless-client/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --manifest-path headless-client/Cargo.toml

  mobile-app:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Reject high and critical mobile dependency advisories
        run: npm audit --audit-level=high
      - name: Test
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Resolve Expo configuration
        run: npx expo config --type public --json > /dev/null
